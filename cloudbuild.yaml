steps:
  # ---- API サービス ----
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-api', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-api']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_PREFIX}-api'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-api'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--no-cpu-throttling'
      - '--timeout=300'
      - '--memory=1Gi'
      - '--update-env-vars=STORE_NAME=${_STORE_NAME},GENERATE_JOB_NAME=${_SERVICE_PREFIX}-generate,ORDER_LIST_SYNC_JOB_NAME=${_SERVICE_PREFIX}-sync,CUSTOM_RENDER_JOB_NAME=${_SERVICE_PREFIX}-custom-render,NEXT_PUBLIC_APP_URL=${_APP_URL}'

  # ---- Job イメージ ----
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job', '-f', 'packages/job/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job']

  # ---- Cloud Run Jobs ----
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_SERVICE_PREFIX}-sync'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job'
      - '--region=asia-northeast1'
      - '--task-timeout=1800'
      - '--memory=2Gi'
      - '--tasks=1'
      - '--parallelism=1'
      - '--update-env-vars=JOB_NAME=sync,STORE_NAME=${_STORE_NAME}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_SERVICE_PREFIX}-generate'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job'
      - '--region=asia-northeast1'
      - '--task-timeout=3600'
      - '--memory=2Gi'
      - '--tasks=1'
      - '--parallelism=1'
      - '--update-env-vars=JOB_NAME=generate,STORE_NAME=${_STORE_NAME},BUYBACK_SPREADSHEET_ID=${_BUYBACK_SPREADSHEET_ID}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_SERVICE_PREFIX}-watchdog'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job'
      - '--region=asia-northeast1'
      - '--task-timeout=5400'
      - '--memory=2Gi'
      - '--tasks=1'
      - '--parallelism=1'
      - '--update-env-vars=JOB_NAME=watchdog,TRIGGER=watchdog,STORE_NAME=${_STORE_NAME}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_SERVICE_PREFIX}-custom-render'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job'
      - '--region=asia-northeast1'
      - '--task-timeout=1800'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--tasks=1'
      - '--parallelism=1'
      - '--update-env-vars=STORE_NAME=${_STORE_NAME},JOB_NAME=render-custom-buyback,TRIGGER=web-ui,TZ=Asia/Tokyo,GCP_PROJECT_ID=$PROJECT_ID'

substitutions:
  _STORE_NAME: 'manman'
  _SERVICE_PREFIX: 'haraka-manman'
  _APP_URL: 'https://harakafor-manman-web.vercel.app'
  _BUYBACK_SPREADSHEET_ID: ''

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-api'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/haraka/haraka-manman-job'
