<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>東京満満｜画像の照合</title>
<style>
:root{color-scheme:light;--bg:#f1ede7;--ink:#1a1613;--muted:#6b5c4f;--line:#d6c6b4;--accent:#8f4d2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Yu Gothic',Meiryo,sans-serif}button,input,select{font:inherit}button,select,input[type=search]{border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px 12px;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:white;border-color:var(--accent)}header{padding:20px 28px 16px;background:#faf7f2;border-bottom:1px solid var(--line)}h1{font:700 25px/1.3 'Yu Mincho',serif;margin:3px 0 8px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent)}.small{font-size:12px;color:var(--muted)}p{margin:6px 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.toolbar .spacer{flex:1}#notice{color:#9b301d;min-height:22px}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100vh - 215px);min-height:650px}aside{border-right:1px solid var(--line);overflow:auto;padding:16px}.filters{display:grid;gap:8px;margin-bottom:14px}.filters input,.filters select{width:100%}.product{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 8px}.product[aria-current=true]{background:#fff;border-left:4px solid var(--accent)}.product strong{display:block;font-size:14px}.product span{font-size:12px;color:var(--muted)}main{overflow:auto;padding:22px 26px 40px;min-width:0}h2{font-size:22px;margin:0}.meta{color:var(--muted);margin-bottom:16px}.compare{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}.source{position:sticky;top:0;align-self:start}.caption{font-size:12px;letter-spacing:.04em;font-weight:700;margin:0 0 10px}.image-button{display:block;width:100%;padding:0;border:0;background:#fff;cursor:zoom-in}.image-button img{display:block;object-fit:contain;width:100%;height:330px}.source .image-button img{height:385px}.image-error{padding:24px;color:#9b301d;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.candidate{background:#faf7f2;border:2px solid transparent;padding:8px}.candidate.chosen{border-color:var(--accent)}.candidate h3{font-size:13px;line-height:1.5;margin:9px 0 3px}.candidate .image-button img{height:265px}.candidate label{display:block;padding-top:8px;cursor:pointer;font-weight:700}.candidate a{color:var(--accent);font-size:12px}.empty{padding:28px;background:#faf7f2;border-left:3px solid var(--line)}.decision{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.checks{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.checks label{cursor:pointer}.checks input{width:17px;height:17px;vertical-align:middle}.decision input[type=text]{display:block;width:100%;padding:10px;border:1px solid var(--line);margin:12px 0;background:#fff}.actions{display:flex;flex-wrap:wrap;gap:10px}.status{font-weight:bold;color:var(--accent)}dialog{border:0;padding:16px;max-width:95vw;max-height:95vh;background:#faf7f2}dialog::backdrop{background:#000a}dialog img{display:block;max-height:80vh;max-width:85vw;object-fit:contain}dialog button{float:right;margin-bottom:8px}#sourceLink{color:var(--accent);font-size:12px}@media(max-width:950px){.workspace{grid-template-columns:210px 1fr}.compare{grid-template-columns:180px 1fr;gap:14px}main{padding:18px}.source .image-button img{height:300px}}@media(max-width:680px){header{padding:16px}h1{font-size:22px}.workspace{display:block;height:auto;min-height:0}aside{max-height:230px;border-bottom:1px solid var(--line)}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}main{overflow:visible}.compare{display:block}.source{position:static;margin-bottom:20px;max-width:270px}.source .image-button img{height:330px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.candidate .image-button img{height:230px}.toolbar .spacer{display:none}}
</style></head><body>
<header><div class="eyebrow">東京満満 / IMAGE REVIEW</div><h1>画像の照合</h1>
<p class="small">左のシンソク商品と、右の既存DB画像・TCGMP候補の絵柄・版を確認してください。価格は変更しません。画像クリックで拡大できます。</p>
<div class="toolbar"><strong id="progress"></strong><span id="coverage" class="small"></span><span class="spacer"></span><button id="export" class="primary">判定JSONを書き出す</button><button id="restore">判定JSONを読み込む</button><input id="import" type="file" accept="application/json,.json" hidden></div>
<div id="notice" class="small" role="status" aria-live="polite">選択だけでは本番に反映されません。途中でもJSONを書き出して保存できます。</div></header>
<div class="workspace"><aside><div class="filters"><input id="search" type="search" aria-label="商品名・カード番号で検索" placeholder="商品名・カード番号で検索"><select id="franchise" aria-label="商材"><option value="">すべての商材</option></select><select id="productType" aria-label="商品種別"><option value="">PSA・BOX すべて</option><option value="psa">PSA</option><option value="box">BOX</option></select><select id="filter" aria-label="表示対象"><option value="ready">候補あり・未判定</option><option value="all">すべて</option><option value="haraka">DB利用済み</option><option value="missing">DB画像なし</option><option value="decided">判定済み</option></select></div><div id="list"></div></aside>
<main><div id="content"></div></main></div>
<dialog id="zoom"><button id="closeZoom">閉じる</button><img id="zoomImage" alt="拡大画像"></dialog>
<script id="data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent), items=data.items;
const $=id=>document.getElementById(id), key='tcgmp-review-v1:'+data.datasetId;
let decisions=Object.create(null), active=items.find(x=>!x.harakaMatch&&x.candidates.length)?.id??items[0]?.id, selected=null;
const labels={adopt:'採用',none:'該当なし',hold:'保留'};
function normalizeDecisions(value){
 if(!value||typeof value!=='object'||Array.isArray(value))throw Error('判定データが不正です');
 const result=Object.create(null);
 for(const [id,d]of Object.entries(value)){
  const item=items.find(x=>x.id===id);
  if(!item||!d||!Object.hasOwn(labels,d.status)||typeof d.note!=='string'||d.note.length>2000||typeof d.at!=='string'||!Number.isFinite(Date.parse(d.at)))throw Error('判定の形式が一致しません');
  if(d.status==='adopt'&&(item.harakaMatch||!item.candidates.some(c=>c.id===d.candidateId&&(c.provider==='haraka'?d.provider==='haraka'&&d.sha256===undefined:c.sha256===d.sha256&&d.provider!=='haraka'))||d.no_sample!==true||d.no_slab!==true||d.variant_confirmed!==true))throw Error('採用候補・確認項目が一致しません');
  result[id]={...d};
 }
 return result;
}
try{const saved=localStorage.getItem(key);if(saved)decisions=normalizeDecisions(JSON.parse(saved));}catch(e){$('notice').textContent='自動保存を利用できません。判定JSONをこまめに書き出してください。';}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function persist(){try{localStorage.setItem(key,JSON.stringify(decisions));$('notice').textContent='このブラウザーに保存しました。終了前に判定JSONを書き出してください。';}catch(e){$('notice').textContent='自動保存できません。判定JSONを書き出してください。';}}
function image(src,name){const b=el('button',undefined,'image-button');b.type='button';b.setAttribute('aria-label',name+'を拡大');const img=el('img');img.src=src;img.alt=name;img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{b.replaceChildren(el('div','画像を表示できません。接続をご確認ください。','image-error'));b.disabled=true;});b.append(img);b.onclick=()=>{$('zoomImage').src=src;$('zoomImage').alt=name;$('zoom').showModal();};return b;}
function filtered(){const q=$('search').value.normalize('NFKC').toLowerCase();return items.filter(x=>(!$('productType').value||(x.product_type??'psa')===$('productType').value)&&(!$('franchise').value||x.franchise===$('franchise').value)&&[x.name,x.model_number,x.id].join(' ').normalize('NFKC').toLowerCase().includes(q)&&($('filter').value==='all'||$('filter').value==='ready'&&!x.harakaMatch&&x.candidates.length&&!decisions[x.id]||$('filter').value==='missing'&&x.harakaStatus==='missing'||$('filter').value==='haraka'&&!!x.harakaMatch||$('filter').value==='decided'&&decisions[x.id]));}
function renderList(){const rows=filtered();$('list').replaceChildren();for(const item of rows){const b=el('button',undefined,'product');b.setAttribute('aria-current',String(item.id===active));b.append(el('strong',item.name),el('span',(item.product_type==='box'?'BOX':'PSA')+' · '+(item.model_number??'番号なし')+' · '+(item.harakaMatch?'DB利用済み':decisions[item.id]?labels[decisions[item.id].status]:item.candidates.length?item.candidates.length+'候補':'候補未取得')));b.onclick=()=>{active=item.id;render();};$('list').append(b);}if(!rows.length)$('list').append(el('p','該当する商品はありません','small'));$('progress').textContent=Object.keys(decisions).length+' / '+items.length+' 商品を判定';$('coverage').textContent='DB採用 '+items.filter(x=>x.harakaMatch).length+'件 / 要確認候補 '+items.filter(x=>!x.harakaMatch&&x.candidates.length).length+'件';}
function render(){renderList();const item=items.find(x=>x.id===active),root=$('content');root.replaceChildren();if(!item)return;const d=decisions[item.id];selected=d?.status==='adopt'?d.candidateId:null;root.append(el('h2',item.name),el('div',item.franchise+' / '+(item.product_type==='box'?'BOX':'PSA')+' / '+(item.model_number??'番号なし')+' / '+item.id,'meta'));const comparison=el('div',undefined,'compare'),source=el('section',undefined,'source');source.append(el('p','比較元 / シンソクの商品画像','caption'));if(item.sourceImage)source.append(image(item.sourceImage,item.name+' 元画像'));else source.append(el('p','元画像がありません'));source.append(el('p',item.product_type==='box'?'BOXの外装・商品名・型番も確認してください。':'PSAラベルの版名も確認してください。','small'));comparison.append(source);const right=el('section');if(item.harakaMatch){right.append(el('p','既存画像 / Haraka DB','caption'),image(item.harakaMatch.image,item.name+' DB画像'),el('p','既存DBの画像を優先利用します。外部候補の確認は不要です。','small'));comparison.append(right);root.append(comparison);return;}right.append(el('p',item.harakaStatus==='ambiguous'?'候補 / Haraka DB の画像':item.product_type==='box'?'候補 / TCGMP のBOX画像':'候補 / TCGMP のカード画像','caption'));const grid=el('div',undefined,'grid');
 for(const c of item.candidates){const article=el('article',undefined,'candidate'+(selected===c.id?' chosen':''));article.append(image(c.image,c.name),el('h3',c.name),el('div',c.sku,'small'),el('div',c.provider==='haraka'?'出典：Haraka DB':'出典：TCGMP','small'));if(c.provider!=='haraka'){const a=el('a','TCGMPの商品ページ ↗');a.href='https://www.tcgmp.jp/s/product/detail?id='+c.id;a.target='_blank';a.rel='noopener noreferrer';article.append(a);}const label=el('label'),radio=el('input');radio.type='radio';radio.name='candidate';radio.value=c.id;radio.checked=selected===c.id;radio.onchange=()=>{selected=c.id;document.querySelectorAll('.candidate').forEach(x=>x.classList.remove('chosen'));article.classList.add('chosen');document.querySelectorAll('.checks input').forEach(x=>x.checked=false);$('adopt').disabled=true;};label.append(radio,document.createTextNode(' この候補を選ぶ'));article.append(label);grid.append(article);}
 if(item.candidates.length){right.append(grid,el('p',item.harakaStatus==='ambiguous'?'既存DBに画像候補がありますが、商品番号・絵柄・版の確認が必要です。':'先頭検索ページの候補です。候補が1件でも同じ版とは限りません。','small'));if(item.collection==='error')right.append(el('p','一部取得：通信失敗で、ほかの候補を取得できていない可能性があります。','small'));}else{right.append(el('div',item.collection==='error'?'取得に失敗しています。候補なしと確定した商品ではありません。':'候補をまだ取得していません。該当商品が存在しないという意味ではありません。','empty'));}comparison.append(right);root.append(comparison);
 const panel=el('section',undefined,'decision');panel.append(el('div',d?'現在の判定：'+labels[d.status]:'未判定','status'));const checks=el('div',undefined,'checks');for(const [id,text]of [['variant_confirmed','絵柄・版が一致'],['no_sample','SAMPLE 表記なし'],['no_slab','PSA ケースなし']]){const label=el('label'),box=el('input');box.type='checkbox';box.id=id;box.checked=d?.status==='adopt'&&d[id]===true;box.onchange=()=>{$('adopt').disabled=!selected||!['variant_confirmed','no_sample','no_slab'].every(k=>$(k).checked);};label.append(box,document.createTextNode(' '+text));checks.append(label);}panel.append(checks);const note=el('input');note.type='text';note.id='note';note.maxLength=2000;note.placeholder='メモ（任意）：版名・気になる点など';note.setAttribute('aria-label','判定メモ');note.value=d?.note??'';panel.append(note);const actions=el('div',undefined,'actions');for(const [status,text]of [['adopt','選んだ候補を採用'],['none','該当なし'],['hold','保留']]){const b=el('button',text,status==='adopt'?'primary':'');b.id=status;b.disabled=status==='adopt'&&(!selected||d?.status!=='adopt');b.onclick=()=>{const c=item.candidates.find(x=>x.id===selected);if(status==='adopt'&&(!c||!['variant_confirmed','no_sample','no_slab'].every(k=>$(k).checked)))return;decisions[item.id]={status,note:note.value,at:new Date().toISOString(),...(status==='adopt'?{candidateId:c.id,...(c.provider==='haraka'?{provider:'haraka'}:{sha256:c.sha256}),no_sample:true,no_slab:true,variant_confirmed:true}:{})};persist();render();};actions.append(b);}const next=el('button','次の未判定へ →');next.onclick=()=>{const ready=items.filter(x=>!x.harakaMatch&&x.candidates.length&&!decisions[x.id]);active=ready.find(x=>items.indexOf(x)>items.indexOf(item))?.id??ready[0]?.id??active;render();};actions.append(next);const clear=el('button','判定を取り消す');clear.onclick=()=>{delete decisions[item.id];persist();render();};actions.append(clear);panel.append(actions);root.append(panel);}
function exported(){const reviewed=[],haraka_reviewed=[];for(const [id,d]of Object.entries(normalizeDecisions(decisions))){if(d.status!=='adopt')continue;const item=items.find(x=>x.id===id),c=item.candidates.find(x=>x.id===d.candidateId&&(x.provider==='haraka'?d.provider==='haraka':x.sha256===d.sha256));const common={source_shinsoku_id:id,product_type:item.product_type??'psa',franchise:item.franchise,name:item.name,model_number:item.model_number,verified_at:d.at,evidence:{no_sample:true,no_slab:true,variant_confirmed:true,note:d.note||'利用者が照合HTMLで絵柄・版の一致、SAMPLEなし、ケースなしを確認'}};if(c.provider==='haraka'){haraka_reviewed.push({...common,db_card_id:c.id,image_url:c.image});}else{reviewed.push({...common,tcgmp_product_id:c.id,tcgmp_sku:c.sku,sha256:c.sha256,file:c.file});}}return{kind:'tcgmp_image_review_v1',dataset_id:data.datasetId,exported_at:new Date().toISOString(),decisions,reviewed,haraka_reviewed};}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(exported(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tcgmp-review-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('restore').onclick=()=>$('import').click();$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error('ファイルが大きすぎます');const value=JSON.parse(await file.text());if(value.kind!=='tcgmp_image_review_v1'||value.dataset_id!==data.datasetId)throw Error('別の照合データです。元のHTMLで読み込んでください');decisions=normalizeDecisions(value.decisions);persist();render();}catch(error){$('notice').textContent=error.message;}finally{e.target.value='';}};
for(const value of [...new Set(items.map(x=>x.franchise))]){const option=el('option',value);option.value=value;$('franchise').append(option);}for(const id of ['search','franchise','productType','filter'])$(id).addEventListener('input',()=>{if(id==='productType'&&$('productType').value==='box'&&$('filter').value==='ready')$('filter').value='all';const rows=filtered();if(!rows.some(x=>x.id===active))active=rows[0]?.id;render();});$('closeZoom').onclick=()=>$('zoom').close();render();
</script></body></html>
